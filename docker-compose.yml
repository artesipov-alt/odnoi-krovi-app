services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: 10.0.0.129
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: disable
      SERVER_PORT: 3000
      ENVIRONMENT: production
      REDIS_HOST: 10.0.0.73
      REDIS_PORT: 6379
      BLOOD_MICROSERVICE_URL: http://blood-microservice:8081
      S3_ENDPOINT: hb.ru-msk.vkcloud-storage.ru
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION:-ru-central1}
    ports:
      - "3000:3000"
    networks:
      - odnoi_net
    restart: unless-stopped
    depends_on:
      blood-microservice:
        condition: service_healthy

  blood-microservice:
    build:
      context: .
      dockerfile: microservices/blood-microservice/Dockerfile
    environment:
      DATABASE_URL: host=10.0.0.129 user=${DB_USER} password=${DB_PASSWORD} dbname=${DB_NAME} port=5432 sslmode=disable
      APP_ENV: production
      SERVER_PORT: 8081
    expose:
      - 8081
    networks:
      - odnoi_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    environment:
      BOT_TOKEN: ${PROD_BOT_API_KEY}
      MINIAPP_DOMAIN: https://1krovi.app
      API_BASE_URL: https://1krovi.app/api/v1
    networks:
      - odnoi_net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    networks:
      - odnoi_net
    restart: unless-stopped

networks:
  odnoi_net:
    driver: bridge
