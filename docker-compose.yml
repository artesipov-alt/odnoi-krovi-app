services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ENV: production
      DB_HOST: 10.0.0.129 # External PostgreSQL server
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: disable
      SERVER_PORT: 3000
      REDIS_HOST: 10.0.0.73 # External Redis server
      REDIS_PORT: 6379
      S3_ENDPOINT: hb.ru-msk.vkcloud-storage.ru
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      MINIAPP_DOMAIN: https://1krovi.app
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION:-ru-central1}
    ports:
      - "3000:3000"
    networks:
      - odnoi_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  tg-bot:
    build:
      context: .
      dockerfile: tg-bot/Dockerfile
    environment:
      BOT_TOKEN: ${TG_BOT_TOKEN}
      MINIAPP_DOMAIN: https://1krovi.app
      API_BASE_URL: https://1krovi.app/api
    networks:
      - odnoi_net
    restart: unless-stopped

  max-bot:
    build:
      context: .
      dockerfile: max-bot/Dockerfile
    environment:
      BOT_TOKEN: ${MAX_BOT_TOKEN}
      MINIAPP_DOMAIN: https://1krovi.app
      API_BASE_URL: https://1krovi.app/api
    networks:
      - odnoi_net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - odnoi_net
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

networks:
  odnoi_net:
    driver: bridge
