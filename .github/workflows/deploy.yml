name: Deploy Odnoikrovi

on:
  push:
    branches:
      - main

env:
  IMAGE_PREFIX: ghcr.io/artesipov-alt/odnoi-krovi-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files_yaml: |
            backend:
              - backend/**
            tg-bot:
              - tg-bot/**
            max-bot:
              - max-bot/**
            frontend:
              - frontend/**

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        if: steps.changed-files.outputs.backend_any_changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/backend:latest
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Build and push tg-bot
        if: steps.changed-files.outputs.tg-bot_any_changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: tg-bot/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/tg-bot:latest
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Build and push max-bot
        if: steps.changed-files.outputs.max-bot_any_changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: max-bot/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/max-bot:latest
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Setup Bun
        if: steps.changed-files.outputs.frontend_any_changed == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Build frontend
        if: steps.changed-files.outputs.frontend_any_changed == 'true'
        working-directory: ./frontend
        run: |
          bun install
          bun run build

      - name: Build and push frontend
        if: steps.changed-files.outputs.frontend_any_changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/frontend:latest
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_ACTOR,CR_PAT
          script: |
            cd ./odnoi-krovi-app
            git fetch origin
            git reset --hard origin/main

            echo "$CR_PAT" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

            docker compose pull

            # Применить pending one-off миграции (таблица applied_migrations в БД).
            # На prod перед этим шагом — бэкап БД (см. backend/migrations/README.md).
            docker compose run --rm --no-deps backend ./migrate prod

            docker compose up -d

            docker container prune -f --filter "until=24h"
            docker network prune -f
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          CR_PAT: ${{ secrets.CR_PAT }}
