name: Deploy Odnoikrovi

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files_yaml: |
            backend:
              - backend/**
            bot:
              - bot/**
            frontend:
              - frontend/**

      - name: Deploy with selective rebuild
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ./odnoi-krovi-app
            git pull origin dev

            # Switch to ZSH to use existing environment
            exec zsh -c '
            # Source ZSH profile to load PATH and aliases
            source ~/.zshrc || true
            source ~/.profile || true
            source ~/.bash_profile || true

            # Check if bun is available and find its location
            if ! command -v bun &> /dev/null; then
              echo "Bun not found in PATH, trying common locations..."
              # Try common bun installation locations
              if [ -f "$HOME/.bun/bin/bun" ]; then
                export PATH="$HOME/.bun/bin:$PATH"
                echo "Found bun in ~/.bun/bin, added to PATH"
              elif [ -f "/usr/local/bin/bun" ]; then
                export PATH="/usr/local/bin:$PATH"
                echo "Found bun in /usr/local/bin, added to PATH"
              elif [ -f "/opt/homebrew/bin/bun" ]; then
                export PATH="/opt/homebrew/bin:$PATH"
                echo "Found bun in /opt/homebrew/bin, added to PATH"
              else
                echo "ERROR: Bun not found. Please install bun on the server."
                exit 1
              fi
            fi

            # Detect which services changed
            BACKEND_CHANGED="${{ steps.changed-files.outputs.backend_any_changed }}"
            BOT_CHANGED="${{ steps.changed-files.outputs.bot_any_changed }}"
            FRONTEND_CHANGED="${{ steps.changed-files.outputs.frontend_any_changed }}"

            echo "Backend changed: $BACKEND_CHANGED"
            echo "Bot changed: $BOT_CHANGED"
            echo "Frontend changed: $FRONTEND_CHANGED"

            # Build frontend on server if needed
            if [[ "$FRONTEND_CHANGED" == "true" ]]; then
              echo "Building frontend on server"
              cd frontend
              # Clean up old build directory
              rm -rf build
              bun install
              bun run build
              cd ..
            fi

            # Build and restart only changed services
            if [[ "$BACKEND_CHANGED" == "true" ]]; then
              echo "Rebuilding backend"
              docker compose up -d --build backend
            fi

            if [[ "$BOT_CHANGED" == "true" ]]; then
              echo "Rebuilding bot"
              docker compose up -d --build bot
            fi

            if [[ "$FRONTEND_CHANGED" == "true" ]]; then
              echo "Rebuilding frontend"
              docker compose up -d --build frontend
            fi

            # If no specific changes detected, rebuild all
            if [[ "$BACKEND_CHANGED" != "true" && "$BOT_CHANGED" != "true" && "$FRONTEND_CHANGED" != "true" ]]; then
              echo "No specific service changes detected, rebuilding all"
              docker compose up -d --build
            fi

            # Clean up unused Docker images to free up disk space
            echo "Cleaning up unused Docker images"
            docker image prune -f
            '
