basePath: /api/v1
definitions:
  handlers.DevResponse:
    properties:
      message:
        type: string
      status:
        type: boolean
    type: object
  handlers.GetDeletedUsersResponse:
    properties:
      message:
        type: string
      status:
        type: boolean
      users:
        items:
          $ref: '#/definitions/models.User'
        type: array
    type: object
  handlers.ReferenceItem:
    properties:
      label:
        type: string
      value:
        type: string
    type: object
  handlers.ReferenceItemDB:
    properties:
      label:
        type: string
      value:
        type: integer
    type: object
  handlers.ReferenceResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.ReferenceItem'
        type: array
    type: object
  handlers.ReferenceResponseDB:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.ReferenceItemDB'
        type: array
    type: object
  handlers.SimpleRegistrationRequest:
    properties:
      fullName:
        example: Иван Иванов
        maxLength: 255
        minLength: 1
        type: string
      telegramId:
        example: 123456789
        minimum: 1
        type: integer
    required:
    - telegramId
    type: object
  models.BloodSearchFilterRequest:
    description: Фильтры для поиска питомцев-реципиентов
    properties:
      bloodGroup:
        description: Группа крови для поиска
        example: DEA 1+
        type: string
      petId:
        description: ID питомца в системе
        example: PET-25-000001
        type: string
      petType:
        description: Тип животного для поиска
        example: dog
        type: string
      regions:
        description: ID регионов для фильтрации
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        type: array
    type: object
  models.BloodSearchPetRequest:
    description: Данные питомца-реципиента для пула поиска крови
    properties:
      bloodComponents:
        description: Необходимые компоненты крови
        example:
        - 1
        - 4
        items:
          type: integer
        type: array
      bloodGroup:
        description: Группа крови животного
        example:
        - DEA 1+
        items:
          type: string
        type: array
      bloodVolumeNeeded:
        description: Необходимый объем крови в мл
        example: 500
        type: integer
      bloodVolumeReserved:
        description: Зарезервированный объем крови в мл
        example: 100
        type: integer
      description:
        description: Описание
        example: Описание проблемы питомца
        type: string
      petId:
        description: ID питомца в системе
        example: PET-25-000001
        type: string
      petType:
        description: Тип животного (dog, cat и т.д.)
        example: dog
        type: string
      regions:
        description: ID регионов для поиска доноров
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        type: array
      smallPetsNotifyAllowed:
        description: Разрешить уведомления для маленьких питомцев
        example: true
        type: boolean
      status:
        description: Статус поиска
        example: active
        type: string
    type: object
  models.BloodSearchPetResponse:
    description: Статус операции с питомцем в пуле поиска крови
    properties:
      petId:
        description: ID питомца в системе
        example: PET-25-000001
        type: string
      status:
        description: Статус операции
        example: added
        type: string
    type: object
  models.BloodSearchPetsResponse:
    description: Список питомцев из пула поиска крови
    properties:
      pets:
        description: Список питомцев
        items:
          $ref: '#/definitions/models.BloodSearchPetRequest'
        type: array
    type: object
  models.Gender:
    enum:
    - male
    - female
    type: string
    x-enum-varnames:
    - GenderMale
    - GenderFemale
  models.LivingCondition:
    enum:
    - indoor
    - leash_walking
    - outdoor
    type: string
    x-enum-varnames:
    - LivingConditionIndoor
    - LivingConditionLeash
    - LivingConditionOutdoor
  models.Pet:
    properties:
      ageMonths:
        example: 6
        type: integer
      ageYears:
        example: 3
        type: integer
      bloodGroup:
        example: DEA 1+
        type: string
      breed:
        example: Лабрадор
        type: string
      chipNumber:
        example: "123456789"
        type: string
      dewormingDate:
        example: "2023-01-01T12:00:00Z"
        type: string
      ectoparasiteDate:
        example: "2023-01-01T12:00:00Z"
        type: string
      gender:
        allOf:
        - $ref: '#/definitions/models.Gender'
        description: ==============Дополнительная регистрация для донорства включает
          в себя=================
        example: male
      hasChip:
        example: false
        type: boolean
      id:
        description: Сигнатура ID питомца включает в себя префикс питомца, год и шестизначный
          номер
        example: PET-25-000001
        type: string
      isGuideDog:
        example: false
        type: boolean
      isTherapist:
        example: false
        type: boolean
      knowsBloodGroup:
        example: false
        type: boolean
      lastTransfusionDate:
        example: "2023-01-01T12:00:00Z"
        type: string
      latitude:
        example: 55.7558
        type: number
      livingCondition:
        allOf:
        - $ref: '#/definitions/models.LivingCondition'
        example: apartment
      longitude:
        example: 37.6173
        type: number
      name:
        example: Бобик
        type: string
      ownerId:
        description: ==============Простая регистрация для поиска крови включает в
          себя=====================
        example: USR-25-0001
        type: string
      petStatus:
        allOf:
        - $ref: '#/definitions/models.PetRole'
        example: donor
      photoUrl:
        example: https://example.com/photo.jpg
        type: string
      sterilized:
        example: false
        type: boolean
      type:
        allOf:
        - $ref: '#/definitions/models.PetType'
        example: dog
      vaccinationDate:
        example: "2023-01-01T12:00:00Z"
        type: string
      weightKg:
        example: 25.5
        type: number
    type: object
  models.PetRole:
    enum:
    - donor
    - recipient
    type: string
    x-enum-varnames:
    - PetRoleDonor
    - PetRoleRecipient
  models.PetType:
    enum:
    - dog
    - cat
    type: string
    x-enum-varnames:
    - PetTypeDog
    - PetTypeCat
  models.User:
    properties:
      allowGeo:
        example: true
        type: boolean
      consentPd:
        example: true
        type: boolean
      createdAt:
        example: "2023-01-01T12:00:00Z"
        type: string
      email:
        example: user@example.com
        type: string
      fullName:
        example: Иван Иванов
        type: string
      id:
        description: Сигнатура ID пользователя включает в себя префикс пользователя,
          год и четырёхзначный номер
        example: USR-25-0001
        type: string
      locationId:
        example: 1
        type: integer
      onBoarding:
        example: false
        type: boolean
      organizationName:
        example: ООО Ромашка
        type: string
      phone:
        example: "+79991234567"
        type: string
      role:
        allOf:
        - $ref: '#/definitions/models.UserRole'
        example: user
      telegramId:
        example: 123456789
        type: integer
    type: object
  models.UserRole:
    enum:
    - user
    - clinic
    - admin
    type: string
    x-enum-varnames:
    - UserRoleUser
    - UserRoleClinic
    - UserRoleAdmin
  services.PetCreate:
    properties:
      ageMonths:
        maximum: 11
        minimum: 0
        type: integer
      ageYears:
        minimum: 0
        type: integer
      bloodGroup:
        maxLength: 50
        type: string
      breed:
        maxLength: 100
        type: string
      chipNumber:
        maxLength: 50
        type: string
      gender:
        $ref: '#/definitions/models.Gender'
      hasChip:
        type: boolean
      isGuideDog:
        type: boolean
      isTherapist:
        type: boolean
      knowsBloodGroup:
        type: boolean
      latitude:
        type: number
      livingCondition:
        $ref: '#/definitions/models.LivingCondition'
      longitude:
        type: number
      name:
        maxLength: 100
        minLength: 1
        type: string
      petStatus:
        allOf:
        - $ref: '#/definitions/models.PetRole'
        maxLength: 50
      photoUrl:
        maxLength: 255
        type: string
      sterilized:
        type: boolean
      type:
        $ref: '#/definitions/models.PetType'
      weightKg:
        minimum: 0
        type: number
    required:
    - name
    type: object
  services.PetUpdate:
    properties:
      ageMonths:
        maximum: 11
        minimum: 0
        type: integer
      ageYears:
        minimum: 0
        type: integer
      bloodGroup:
        maxLength: 50
        type: string
      breed:
        maxLength: 100
        type: string
      chipNumber:
        maxLength: 50
        type: string
      gender:
        $ref: '#/definitions/models.Gender'
      hasChip:
        type: boolean
      isGuideDog:
        type: boolean
      isTherapist:
        type: boolean
      knowsBloodGroup:
        type: boolean
      latitude:
        type: number
      livingCondition:
        $ref: '#/definitions/models.LivingCondition'
      longitude:
        type: number
      name:
        maxLength: 100
        minLength: 1
        type: string
      petStatus:
        allOf:
        - $ref: '#/definitions/models.PetRole'
        maxLength: 50
      photoUrl:
        maxLength: 255
        type: string
      sterilized:
        type: boolean
      type:
        $ref: '#/definitions/models.PetType'
      weightKg:
        minimum: 0
        type: number
    type: object
  services.UserRegistration:
    properties:
      consentPd:
        type: boolean
      email:
        type: string
      fullName:
        maxLength: 255
        minLength: 2
        type: string
      locationId:
        minimum: 1
        type: integer
      phone:
        type: string
      role:
        allOf:
        - $ref: '#/definitions/models.UserRole'
        enum:
        - user
        - clinic_admin
    required:
    - consentPd
    - fullName
    - locationId
    - phone
    - role
    type: object
  services.UserUpdate:
    properties:
      allowGeo:
        type: boolean
      email:
        type: string
      fullName:
        maxLength: 255
        minLength: 2
        type: string
      locationId:
        minimum: 1
        type: integer
      onBoarding:
        type: boolean
      phone:
        type: string
    type: object
  utils.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  utils.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
    type: object
info:
  contact: {}
  description: API сервиса однойкрови.рф для донороcства крови и помощи животным
  title: 1krovi.app
  version: 1.2.4
paths:
  /:
    get:
      description: Возвращает информационное сообщение о сервере
      produces:
      - text/html
      responses:
        "200":
          description: Информационное сообщение с HTML-ссылкой
          schema:
            type: string
      summary: Корневой эндпоинт
      tags:
      - root
  /dev/deleted-users:
    get:
      description: Возвращает список всех мягко удаленных пользователей
      produces:
      - application/json
      responses:
        "200":
          description: Список удаленных пользователей
          schema:
            $ref: '#/definitions/handlers.GetDeletedUsersResponse'
      summary: Получение всех удаленных пользователей
      tags:
      - dev
  /dev/reset-user/{id}:
    post:
      description: Сбрасывает пользователя к заводским настройкам на этапе команды
        старт от бота
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Успешный сброс пользователя
          schema:
            $ref: '#/definitions/handlers.DevResponse'
      summary: Сброс пользователя к начальным настройкам
      tags:
      - dev
  /dev/restore-user/{id}:
    post:
      description: Восстанавливает мягко удаленного пользователя, устанавливая deleted_at
        в NULL
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Успешное восстановление пользователя
          schema:
            $ref: '#/definitions/handlers.DevResponse'
      summary: Восстановление удаленного пользователя
      tags:
      - dev
  /pets/{id}:
    delete:
      description: Удаляет питомца из системы
      parameters:
      - description: ID питомца
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Питомец успешно удален
          schema:
            $ref: '#/definitions/utils.SuccessResponse'
        "400":
          description: Неверный запрос
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Питомец не найден
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Удаление питомца по ID
      tags:
      - pets
    get:
      description: Возвращает информацию о питомце по его идентификатору
      parameters:
      - description: ID питомца
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Данные питомца
          schema:
            $ref: '#/definitions/models.Pet'
        "400":
          description: Неверный запрос
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Питомец не найден
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Получение питомца по ID
      tags:
      - pets
    put:
      consumes:
      - application/json
      description: Обновляет информацию о питомце
      parameters:
      - description: ID питомца
        in: path
        name: id
        required: true
        type: string
      - description: Данные для обновления
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/services.PetUpdate'
      produces:
      - application/json
      responses:
        "200":
          description: Данные успешно обновлены
          schema:
            $ref: '#/definitions/utils.SuccessResponse'
        "400":
          description: Неверный запрос
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Питомец не найден
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Обновление данных питомца
      tags:
      - pets
  /pets/blood-request/pool:
    post:
      consumes:
      - application/json
      description: Добавляет питомца-реципиента в пул поиска крови
      parameters:
      - description: Данные питомца для пула поиска крови
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BloodSearchPetRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Статус добавления питомца
          schema:
            $ref: '#/definitions/models.BloodSearchPetResponse'
        "400":
          description: Неверный запрос
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Добавить питомца в пул поиска крови
      tags:
      - pets
      - blood-request
  /pets/blood-request/pool/search:
    post:
      consumes:
      - application/json
      description: Возвращает список питомцев-реципиентов по фильтрам
      parameters:
      - description: 'Фильтры поиска: тип, группа крови, регионы'
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BloodSearchFilterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Список питомцев
          schema:
            $ref: '#/definitions/models.BloodSearchPetsResponse'
        "400":
          description: Неверный запрос
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Получить питомцев из пула поиска крови
      tags:
      - pets
      - blood-request
  /pets/upload/avatar/{id}:
    get:
      description: Возвращает временную ссылку для загрузки фотографии питомца по
        ID
      parameters:
      - description: ID питомца
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Ссылка для загрузки фотографии и путь к файлу
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Неверный запрос
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Питомец не найден
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Получить ссылку для загрузки фотографии питомца
      tags:
      - pets
  /pets/upload/avatar/confirm/{path}:
    post:
      description: Подтверждает загрузку аватарки питомца, делает её публичной и возвращает
        публичную ссылку
      parameters:
      - description: 'Путь к аватарке питомца (например: pets/PET-25-000001/avatar.jpg)'
        in: path
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Публичная ссылка на аватарку
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Неверный запрос
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Питомец не найден
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Подтверждение загрузки аватарки питомца
      tags:
      - pets
  /pets/user/{user_id}:
    get:
      description: Возвращает всех питомцев конкретного пользователя
      parameters:
      - description: ID пользователя
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Список питомцев
          schema:
            items:
              $ref: '#/definitions/models.Pet'
            type: array
        "400":
          description: Неверный запрос
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Получение питомцев пользователя
      tags:
      - pets
    post:
      consumes:
      - application/json
      description: Создает нового питомца для пользователя
      parameters:
      - description: ID пользователя
        in: path
        name: user_id
        required: true
        type: string
      - description: Данные питомца
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/services.PetCreate'
      produces:
      - application/json
      responses:
        "201":
          description: Созданный питомец
          schema:
            $ref: '#/definitions/models.Pet'
        "400":
          description: Неверный запрос
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Создание нового питомца
      tags:
      - pets
  /reference/blood-components:
    get:
      description: Возвращает список компонентов крови животных для выбора на фронтенде
      produces:
      - application/json
      responses:
        "200":
          description: Список компонентов крови
          schema:
            $ref: '#/definitions/handlers.ReferenceResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Получение компонентов крови животных
      tags:
      - reference
      - pets
  /reference/blood-groups/{pet_type}:
    get:
      description: Возвращает список групп крови животных для выбора на фронтенде
      parameters:
      - description: Тип животного
        in: path
        name: pet_type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Список групп крови
          schema:
            $ref: '#/definitions/handlers.ReferenceResponseDB'
        "400":
          description: Неверный тип животного
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Получение групп крови животных по типу животного
      tags:
      - reference
      - pets
  /reference/blood-search-statuses:
    get:
