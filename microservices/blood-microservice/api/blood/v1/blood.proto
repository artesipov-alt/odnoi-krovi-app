syntax = "proto3";

package blood.v1;

message AddToSearchPoolReq {
  string ID = 1;
  string petID = 2;
  string bloodGroup = 3;
  repeated string bloodComponents = 4;
  float bloodVolume = 5;
  repeated int32 regions = 6;
  bool smallPetsNotifyAllowed = 7;
}

message AddToSearchPoolResp {
  bool status = 1;
}

service BloodService {
  rpc AddToSearchPool(AddToSearchPoolReq) returns (AddToSearchPoolResp);
}
