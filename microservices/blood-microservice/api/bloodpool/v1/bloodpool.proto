syntax = "proto3";

package bloodpool.v1;

message PetRow {
  int64 id = 1;
  string pet_id = 2;
  string pet_type = 3;
  string blood_group = 4;
  repeated string blood_components = 5;
  float blood_volume = 6;
  repeated int32 regions = 7;
  bool small_pets_notify_allowed = 8;
  string status = 9;
  int32 priority_level = 10;
}

message PetRowStatus {
  int64 row_id = 1;
  string status = 2;
}

message GetPetRows {
  string pet_type = 1;
  string blood_group = 2;
  repeated int32 regions = 3;
}

message PetRows {
  repeated PetRow pets = 1;
}

service BloodSearchPool {
  rpc AddPet(PetRow) returns (PetRowStatus);
  rpc GetPets(GetPetRows) returns (PetRows);
}
