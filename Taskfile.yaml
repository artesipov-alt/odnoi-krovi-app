version: "3"

env:
  ENV_FILE: .env

tasks:
  generate-ts:
    desc: "Сгенерировать типы API Backend для TypeScript"
    cmds:
      - task: generate-docs # Changed from generate-swagger to generate-docs for consistency
      - openapi-generator generate -i ./backend/docs/openapi.json -g typescript-fetch -o shared/ts

  generate-docs:
    desc: "Сгенерировать OpenAPI документацию"
    dir: backend
    cmds:
      - go run ./cmd/api/main.go openapi

  install:
    desc: "Установить все зависимости проекта"
    cmds:
      - task: install-backend
      - task: install-microservice
      - task: install-frontend
      - task: install-bot

  install-backend:
    desc: "Установить зависимости backend"
    dir: backend
    cmds:
      - go mod tidy

  install-microservice:
    desc: "Установить зависимости микросервиса" # Corrected description
    dir: microservices/blood-microservice
    cmds:
      - go mod tidy

  install-frontend:
    desc: "Установить зависимости frontend"
    dir: frontend
    cmds:
      - bun install

  install-bot:
    desc: "Установить зависимости bot"
    dir: tg-bot
    cmds:
      - bun install

  # Запуск в режиме разработки
  dev:
    desc: "Запустить все сервисы в режиме разработки"
    cmds:
      - task: dev-backend
      - task: dev-micoservice # Added microservice to dev tasks
      - task: dev-frontend
      - task: dev-bot

  dev-backend:
    desc: "Запустить backend в dev режиме"
    dir: backend
    cmds:
      - task: generate-docs # Changed from generate-swagger to generate-docs for consistency
      - go run cmd/api/main.go

  dev-micoservice:
    desc: "Запустить микросервис в dev режиме" # Corrected description
    dir: microservices/blood-microservice
    cmds:
      - go run cmd/microservice/main.go

  dev-frontend:
    desc: "Запустить frontend в dev режиме"
    dir: frontend
    cmds:
      - npm run dev

  dev-tg-bot:
    desc: "Запустить bot в dev режиме"
    dir: tg-bot
    cmds:
      - bun run dev

  dev-max-bot:
    desc: "Запустить bot в dev режиме"
    dir: max-bot
    cmds:
      - bun run dev

  # Сборка проекта
  build:
    desc: "Собрать все компоненты проекта"
    cmds:
      - task: build-backend
      - task: build-frontend
      - task: build-bot

  build-backend:
    desc: "Собрать backend"
    dir: backend
    cmds:
      - go build -o app/api cmd/api/main.go

  build-frontend:
    desc: "Собрать frontend"
    dir: frontend
    cmds:
      - rm -rf build
      - bun run build

  build-bot:
    desc: "Собрать bot"
    dir: bot
    cmds:
      - rm -rf dist
      - bun run build

  # Миграции базы данных (SQL-файлы из backend/migrations/)
  # Применяются через psql. См. backend/migrations/README.md.
  # ENV: local (по умолчанию), dev, prod.
  db:migrate:
    desc: "Применить все SQL-миграции к БД (ENV=dev|prod|local, по умолчанию local)"
    dir: backend
    cmds:
      - >-
        psql "$(go run ./cmd/dburl {{.ENV | default "local"}})" \
          -v ON_ERROR_STOP=1 \
          -f migrations/20260728000001_regions_okato.sql \
          -f migrations/20260728000002_breeds.sql

  db:migrate:regions:
    desc: "Применить только миграцию регионов (ENV=dev|prod|local)"
    dir: backend
    cmds:
      - >-
        psql "$(go run ./cmd/dburl {{.ENV | default "local"}})" \
          -v ON_ERROR_STOP=1 \
          -f migrations/20260728000001_regions_okato.sql

  db:migrate:breeds:
    desc: "Применить только миграцию пород (ENV=dev|prod|local)"
    dir: backend
    cmds:
      - >-
        psql "$(go run ./cmd/dburl {{.ENV | default "local"}})" \
          -v ON_ERROR_STOP=1 \
          -f migrations/20260728000002_breeds.sql
